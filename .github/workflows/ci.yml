name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub/models--minishlab--potion-base-8M
          key: mcp-contrast-model-potion-base-8M-bf8b056651a2
      - run: uv sync --locked
      - run: uv run pytest

  action:
    name: action self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Clean example passes
        uses: ./
        with:
          sources: examples/clean.json

      - name: Problem example fails
        id: problems
        continue-on-error: true
        uses: ./
        with:
          sources: examples/crm.json
          sarif-file: problems.sarif

      - name: Check the failure and the SARIF
        env:
          OUTCOME: ${{ steps.problems.outcome }}
          SARIF: ${{ steps.problems.outputs.sarif-file }}
        run: |
          test "$OUTCOME" = failure
          jq -e '.runs[0].results | map(.ruleId) | sort == ["hidden-overlap","synonym-contrast","unmarked-contrast"]' "$SARIF"

      - name: Live stdio server via args
        uses: ./
        with:
          args: --stdio 'python3 tests/servers/stdio_server.py' --fail-on never
          sarif-file: ""

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build
      - name: Smoke-test the wheel
        run: |
          uv tool run --from dist/*.whl mcp-contrast --version
          uv tool run --from dist/*.whl mcp-contrast check examples/clean.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
